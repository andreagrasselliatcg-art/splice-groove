name: Build macOS (AU + VST3 + PKG)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: "Build AU + VST3 (universal: Apple Silicon + Intel)"
        run: cmake --build build --config Release --target SpliceGroove_AU SpliceGroove_VST3 -j 3

      - name: Ad-hoc code signing
        run: |
          codesign --force --deep -s - "build/SpliceGroove_artefacts/Release/AU/Splice Groove.component"
          codesign --force --deep -s - "build/SpliceGroove_artefacts/Release/VST3/Splice Groove.vst3"
          lipo -info "build/SpliceGroove_artefacts/Release/AU/Splice Groove.component/Contents/MacOS/Splice Groove"

      - name: Validate Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/"Splice Groove.component"
          cp -R "build/SpliceGroove_artefacts/Release/AU/Splice Groove.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aumu SpGv Agrs

      - name: Build installer .pkg
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p pkgroot/Components pkgroot/VST3 pkgscripts
          cp -R "build/SpliceGroove_artefacts/Release/AU/Splice Groove.component" pkgroot/Components/
          cp -R "build/SpliceGroove_artefacts/Release/VST3/Splice Groove.vst3" pkgroot/VST3/
          printf '#!/bin/bash\nkillall -9 AudioComponentRegistrar 2>/dev/null || true\nexit 0\n' > pkgscripts/postinstall
          chmod +x pkgscripts/postinstall
          pkgbuild --analyze --root pkgroot components.plist
          python3 -c "import plistlib;f='components.plist';d=plistlib.load(open(f,'rb'))
          def fix(x):
              for e in x:
                  e['BundleIsRelocatable']=False; fix(e.get('ChildBundles',[]))
          fix(d);plistlib.dump(d,open(f,'wb'))"
          cat components.plist
          pkgbuild --root pkgroot \
                   --component-plist components.plist \
                   --install-location /Library/Audio/Plug-Ins \
                   --scripts pkgscripts \
                   --identifier com.andreagrasselli.splicegroove.pkg \
                   --version "$VERSION" \
                   "SpliceGroove-${VERSION}-macOS.pkg"
          pkgutil --payload-files "SpliceGroove-${VERSION}-macOS.pkg" | head -20
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package zip (manual install)
        run: |
          mkdir -p dist
          cp -R "build/SpliceGroove_artefacts/Release/AU/Splice Groove.component" dist/
          cp -R "build/SpliceGroove_artefacts/Release/VST3/Splice Groove.vst3" dist/
          cp install_mac.command dist/
          cd dist && zip -r -y "../SpliceGroove-${VERSION}-macOS.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: SpliceGroove-macOS
          path: |
            SpliceGroove-*-macOS.pkg
            SpliceGroove-*-macOS.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "SpliceGroove-${VERSION}-macOS.pkg" \
            "SpliceGroove-${VERSION}-macOS.zip" \
            --title "Splice Groove ${VERSION}" \
            --notes "Installer per macOS (Apple Silicon + Intel). Scarica il .pkg, tasto destro > Apri, segui l'installazione. In Logic: Software Instrument > AU Instruments > Andrea Grasselli > Splice Groove."
